name: Update VPN Data

on:
    schedule:
        - cron: '0 */3 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout data branch
              uses: actions/checkout@v4
              with:
                  ref: data
                  path: data-branch

            - name: Checkout source branch
              uses: actions/checkout@v4
              with:
                  path: source

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Generate VPN data
              working-directory: data-branch
              run: node ../source/scripts/download-vpn-info.ts

            - name: Commit updated data
              working-directory: data-branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/vpn.csv.gz
                  git diff --cached --quiet || git commit -m "chore: update VPN data"
                  git push origin data
